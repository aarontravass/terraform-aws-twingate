name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The connector is usable on its own, so it is checked on its own.
        # Running only at the root would cover it by accident.
        dir:
          - "."
          - "modules/connector"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: Terraform validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}

      # Providers are mocked, so no AWS or Twingate credentials are needed.
      - name: Terraform test
        run: terraform test -no-color
        working-directory: ${{ matrix.dir }}

  docs:
    runs-on: ubuntu-latest
    env:
      # Must match the binary used locally. terraform-docs/gh-actions@v1.4.1
      # ships terraform-docs 0.20.0, whose output for modules/connector differs
      # from 0.24.0, so the action is deliberately not used here.
      TERRAFORM_DOCS_VERSION: v0.24.0
    steps:
      - uses: actions/checkout@v4

      - name: Install terraform-docs
        run: |
          set -euo pipefail
          url="https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          curl -sSfL "$url" -o /tmp/terraform-docs.tar.gz
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          sudo install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      # Fails when a README's generated block no longer matches the .tf files.
      # That is how remote_network_location stayed documented after #4 removed it.
      - name: terraform-docs is up to date
        run: |
          set -euo pipefail
          for dir in . modules/connector; do
            terraform-docs markdown table --config .terraform-docs.yml --output-check "$dir"
          done

  comment:
    needs: [fmt, test, docs]
    # Runs whether the checks passed or failed -- reporting a failure is the
    # case that matters. Job results are read from `needs`, so no step-level
    # continue-on-error juggling is required, and a failed check still turns
    # the PR red on its own.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        with:
          script: |
            const icon = (r) =>
              r === 'success' ? ':white_check_mark:' :
              r === 'skipped' ? ':fast_forward:' : ':x:';

            const fmt = process.env.FMT_RESULT;
            const test = process.env.TEST_RESULT;
            const docs = process.env.DOCS_RESULT;

            const body = [
              '## Terraform CI',
              '',
              `${icon(fmt)} **Format** — \`terraform fmt -check -recursive\` — \`${fmt}\``,
              `${icon(test)} **Validate and test** — root and \`modules/connector\` — \`${test}\``,
              `${icon(docs)} **Docs** — terraform-docs up to date — \`${docs}\``,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
