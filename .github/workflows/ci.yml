name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The connector is usable on its own, so it is checked on its own.
        # Running only at the root would cover it by accident.
        dir:
          - "."
          - "modules/connector"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: Terraform validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}

      # Providers are mocked, so no AWS or Twingate credentials are needed.
      - name: Terraform test
        run: terraform test -no-color
        working-directory: ${{ matrix.dir }}

  comment:
    needs: [fmt, test]
    # Runs whether the checks passed or failed -- reporting a failure is the
    # case that matters. Job results are read from `needs`, so no step-level
    # continue-on-error juggling is required, and a failed check still turns
    # the PR red on its own.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const icon = (r) =>
              r === 'success' ? ':white_check_mark:' :
              r === 'skipped' ? ':fast_forward:' : ':x:';

            const fmt = process.env.FMT_RESULT;
            const test = process.env.TEST_RESULT;

            const body = [
              '## Terraform CI',
              '',
              `${icon(fmt)} **Format** — \`terraform fmt -check -recursive\` — \`${fmt}\``,
              `${icon(test)} **Validate and test** — root and \`connector/\` — \`${test}\``,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
