name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Two pushes landing close together would otherwise both read the same "latest
# tag" and race to create the same version. Releases are serialised instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The connector is usable on its own, so it is validated on its own.
        # Validating only the root would leave it covered by accident.
        dir:
          - "."
          - "modules/connector"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: Terraform validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}

      # Providers are mocked, so no AWS or Twingate credentials are needed.
      # A failure here blocks the tag job, so a broken commit never ships.
      - name: Terraform test
        run: terraform test -no-color
        working-directory: ${{ matrix.dir }}

  docs:
    runs-on: ubuntu-latest
    env:
      # Must match the binary used locally. terraform-docs/gh-actions@v1.4.1
      # ships terraform-docs 0.20.0, whose output for modules/connector differs
      # from 0.24.0, so the action is deliberately not used here.
      TERRAFORM_DOCS_VERSION: v0.24.0
    steps:
      - uses: actions/checkout@v4

      - name: Install terraform-docs
        run: |
          set -euo pipefail
          url="https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          curl -sSfL "$url" -o /tmp/terraform-docs.tar.gz
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          sudo install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      # Fails when a README's generated block no longer matches the .tf files.
      # That is how remote_network_location stayed documented after #4 removed it.
      - name: terraform-docs is up to date
        run: |
          set -euo pipefail
          for dir in . modules/connector; do
            terraform-docs markdown table --config .terraform-docs.yml --output-check "$dir"
          done

  tag:
    needs: [fmt, validate, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The action reads existing tags to work out the next version.
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        # anothrNick/github-tag-action 1.75.0, pinned by commit rather than by
        # the mutable release tag. Bumps patch by default; #major, #minor,
        # #patch or #none in the commit message override that. It is a no-op
        # when HEAD already carries a tag, so re-runs are safe.
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          RELEASE_BRANCHES: main
          INITIAL_VERSION: 0.0.0

      - name: Create GitHub release
        if: steps.tag.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: gh release create "$NEW_TAG" --title "$NEW_TAG" --generate-notes
